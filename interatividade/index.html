<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espetáculo Kihap • Backdrop Telão</title>
    <link rel="icon" href="/assets/favicon.jpg" type="image/jpeg">

    <!-- Fontes & Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS Externo + Incorporado para Garantir Carregamento Imediato -->
    <link rel="stylesheet" href="/interatividade/telao.css">
    <style>
        :root {
            --bg-backdrop: #07080a;
            --text-name: #9198a4;
            --gold-glow: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-backdrop);
            color: var(--text-name);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        .hidden {
            display: none !important;
        }

        /* Fundo Preto com Vinheta */
        .backdrop-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(20, 22, 28, 0.75) 0%, #060709 100%);
        }

        /* Marca d'água Gigante "KIHAP" centralizada no fundo */
        .backdrop-watermark-kihap {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(32vw, 480px);
            font-weight: 900;
            letter-spacing: -2px;
            color: rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            z-index: 2;
            pointer-events: none;
            line-height: 0.8;
            user-select: none;
            text-align: center;
            font-family: 'Outfit', 'Anton', sans-serif;
        }

        /* Canvas de Partículas e Faíscas */
        #particles-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            pointer-events: none;
        }

        /* Container de Rolagem Contínua */
        .backdrop-wall {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            z-index: 10;
            padding: 0 4vw;
        }

        /* Pista de Rolagem Infinita (GPU-Accelerated) */
        .backdrop-crawl-track {
            width: 92vw;
            max-width: 1750px;
            display: flex;
            flex-direction: column;
            animation: crawlLoop 65s linear infinite;
            will-change: transform;
        }

        .backdrop-crawl-track.paused {
            animation-play-state: paused;
        }

        @keyframes crawlLoop {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }

        /* Bloco Tipográfico Justificado - Nomes Grandes e Bem Legíveis */
        .backdrop-text-block {
            text-align: justify;
            text-justify: inter-word;
            font-size: clamp(15px, 1.35vw, 21px);
            line-height: 2.3;
            font-weight: 700;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            color: var(--text-name);
            padding-bottom: 28px;
        }

        /* Cada Nome de Aluno - Não quebra palavra no meio e tem espaçamento elegante */
        .backdrop-name-item {
            display: inline-block;
            white-space: nowrap;
            color: var(--text-name);
            transition: color 0.35s ease, background 0.35s ease, text-shadow 0.35s ease, transform 0.35s ease;
            padding: 2px 8px;
            margin: 0 10px;
            border-radius: 4px;
            cursor: default;
        }

        /* Destaque Ativo de Torcida: Nome Brilha com Fogo Dourado */
        .backdrop-name-item.cheer-active {
            color: #ffffff !important;
            background: rgba(251, 191, 36, 0.35) !important;
            text-shadow: 0 0 20px rgba(251, 191, 36, 1), 0 0 35px #f59e0b, 0 0 50px #ffffff;
            border: 1px solid rgba(251, 191, 36, 0.9);
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.95);
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1.05); box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
            100% { transform: scale(1.18); box-shadow: 0 0 45px rgba(251, 191, 36, 1); }
        }

        /* Banner de Celebração Discreto no Rodapé */
        .torcida-celebration-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, rgba(20, 22, 32, 0.98), rgba(10, 11, 16, 0.98));
            border: 2px solid #fbbf24;
            border-radius: 999px;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(251, 191, 36, 0.4);
            z-index: 50;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            max-width: 90vw;
        }

        .torcida-celebration-toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            font-size: 26px;
        }

        .toast-info {
            display: flex;
            flex-direction: column;
        }

        .toast-tag {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fbbf24;
            text-transform: uppercase;
        }

        .toast-name {
            font-size: 17px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toast-msg {
            font-size: 12px;
            color: #e5e7eb;
            font-style: italic;
        }

        /* Toolbar Discreta de Operador (Invisível no telão, surge apenas no hover no topo direito) */
        .operator-floating-toolbar {
            position: fixed;
            top: 14px;
            right: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(12, 14, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 6px 10px;
        }

        .operator-floating-toolbar:hover {
            opacity: 1;
        }

        .operator-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .operator-btn:hover {
            background: rgba(251, 191, 36, 0.18);
            border-color: #fbbf24;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <!-- Fundo Preto e Marca d'água Gigante "KIHAP" centralizada -->
    <div class="backdrop-bg"></div>
    <div class="backdrop-watermark-kihap">KIHAP</div>
    <canvas id="particles-canvas"></canvas>

    <!-- Toolbar Discreta de Operador (No canto superior direito, visível apenas no hover) -->
    <div class="operator-floating-toolbar" id="operator-toolbar">
        <button id="btn-fullscreen" class="operator-btn" title="Tela Cheia (Atalho: F)">
            <i class="fas fa-expand"></i> Tela Cheia
        </button>
        <button id="btn-som" class="operator-btn" title="Ligar/Desligar Som (Atalho: S)">
            <i class="fas fa-volume-high"></i> Som
        </button>
        <button id="btn-simular" class="operator-btn" title="Simular Torcida (Atalho: Espaço)">
            <i class="fas fa-wand-magic-sparkles"></i> Simular
        </button>
    </div>

    <!-- O Grande Mural / Pista de Rolagem Infinita de Nomes -->
    <main class="backdrop-wall">
        <div class="backdrop-crawl-track" id="backdrop-crawl-track">
            <!-- Bloco 1 -->
            <div class="backdrop-text-block" id="backdrop-text-block-1"></div>
            <!-- Bloco 2 (Para loop contínuo e infinito sem salto visual) -->
            <div class="backdrop-text-block" id="backdrop-text-block-2"></div>
        </div>
    </main>

    <!-- Toast / Banner de Celebração de Torcida -->
    <div id="torcida-toast" class="torcida-celebration-toast">
        <div id="toast-icon" class="toast-icon">🔥</div>
        <div class="toast-info">
            <span class="toast-tag"><i class="fas fa-star"></i> Torcida no Telão</span>
            <span id="toast-name" class="toast-name">NOME DO ALUNO</span>
            <span id="toast-msg" class="toast-msg">"Grito de torcida enviado!"</span>
        </div>
    </div>

    <!-- Scripts com caminhos absolutos para nunca falhar -->
    <script src="/interatividade/dados-alunos.js"></script>
    <script src="/interatividade/sync.js"></script>
    <script src="/interatividade/telao.js"></script>
</body>
</html>
