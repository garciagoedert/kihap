<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Miles — Assistente Virtual | Kihap Martial Arts</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kihap: {
                            gold: '#FFC107',
                            amber: '#FF8F00',
                            dark: '#0F0F11',
                            card: '#18181B'
                        }
                    },
                    fontFamily: {
                        title: ['Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
        }

        /* Glassmorphism Cards */
        .miles-glass-header {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .miles-glass-footer {
            background: rgba(18, 18, 20, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .miles-user-bubble {
            background: linear-gradient(135deg, #FFC107 0%, #FF8F00 100%);
            color: #09090b;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(255, 193, 7, 0.25);
        }

        .miles-bot-bubble {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f4f4f5;
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(8px);
        }

        /* Animations */
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .online-dot-pulse {
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes bounceDot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .typing-dot {
            animation: bounceDot 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Custom Scrollbar */
        #miles-chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        #miles-chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* Hide scrollbars for chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="h-full overflow-hidden flex flex-col justify-between">

    <!-- Container App Shell Mobile / Desktop Centered Frame -->
    <div class="w-full max-w-2xl mx-auto h-full flex flex-col bg-zinc-950 border-x border-zinc-800/50 shadow-2xl relative">

        <!-- HEADER -->
        <header class="miles-glass-header px-4 py-3 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center gap-3">
                <a href="index.html" class="p-2 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800/60 transition-colors flex items-center justify-center" aria-label="Voltar para a home">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                
                <div class="relative">
                    <div class="w-10 h-10 rounded-2xl overflow-hidden ring-2 ring-amber-400/40 bg-zinc-800 flex items-center justify-center">
                        <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles Avatar" class="w-full h-full object-cover">
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-zinc-950 rounded-full online-dot-pulse"></span>
                </div>

                <div>
                    <h1 class="text-sm font-extrabold text-white flex items-center gap-1.5 font-title tracking-wide">
                        Miles
                        <span class="bg-amber-400/10 text-amber-400 border border-amber-400/20 text-[9px] px-1.5 py-0.5 rounded-full font-sans font-semibold">AI</span>
                    </h1>
                    <p class="text-[11px] text-zinc-400 font-medium">Assistente Virtual Kihap</p>
                </div>
            </div>

            <div class="flex items-center gap-1">
                <button id="miles-reset-btn" class="p-2 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800/60 transition-colors" title="Reiniciar conversa" aria-label="Reiniciar conversa">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- CHAT MESSAGES AREA -->
        <main id="miles-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
            
            <!-- Miles Welcome Card -->
            <div class="flex flex-col items-center text-center my-4 p-5 rounded-3xl bg-zinc-900/60 border border-amber-400/20 shadow-inner">
                <div class="w-16 h-16 rounded-3xl overflow-hidden ring-4 ring-amber-400/30 mb-3 bg-zinc-800 shadow-lg">
                    <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles" class="w-full h-full object-cover">
                </div>
                <h2 class="text-base font-bold text-white font-title uppercase tracking-tight">Oi, eu sou o Miles! 🥋</h2>
                <p class="text-xs text-zinc-400 mt-1 max-w-sm leading-relaxed">
                    Estou aqui para tirar dúvidas, mostrar os programas da Kihap, consultar horários e agendar sua <strong>aula experimental gratuita</strong>!
                </p>
            </div>

            <!-- Typing indicator (hidden by default) -->
            <div id="miles-typing-indicator" class="hidden flex items-start gap-2 max-w-[85%]">
                <div class="w-7 h-7 rounded-xl overflow-hidden bg-zinc-800 shrink-0 border border-zinc-700/50">
                    <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles" class="w-full h-full object-cover">
                </div>
                <div class="miles-bot-bubble px-4 py-3 rounded-2xl flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-zinc-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-zinc-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-zinc-400 rounded-full typing-dot"></span>
                </div>
            </div>

        </main>

        <!-- FOOTER & INPUT AREA -->
        <footer class="miles-glass-footer p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] z-20 shrink-0 space-y-2.5">
            
            <!-- Quick Chips Bar -->
            <div id="miles-chips-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 px-1">
                <button class="miles-chip text-xs font-semibold bg-zinc-900/90 text-amber-300 border border-amber-400/30 hover:border-amber-400 hover:bg-amber-400/10 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Quero agendar uma aula experimental grátis">
                    <span>🥋</span> Agendar aula grátis
                </button>
                <button class="miles-chip text-xs font-medium bg-zinc-900/80 text-zinc-300 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0" data-prompt="Quais turmas e horários estão disponíveis?">
                    <span>📅</span> Ver horários de aulas
                </button>
                <button class="miles-chip text-xs font-medium bg-zinc-900/80 text-zinc-300 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0" data-prompt="Onde ficam as unidades da Kihap?">
                    <span>📍</span> Onde ficam as unidades?
                </button>
                <button class="miles-chip text-xs font-medium bg-zinc-900/80 text-zinc-300 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0" data-prompt="Me explique sobre os programas para crianças e adultos">
                    <span>💡</span> Conhecer programas
                </button>
                <button class="miles-chip text-xs font-medium bg-zinc-900/80 text-zinc-300 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-800 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0" data-prompt="Quero falar no WhatsApp de uma unidade">
                    <span>💬</span> Falar no WhatsApp
                </button>
            </div>

            <!-- Input Form -->
            <form id="miles-chat-form" class="flex items-center gap-2 bg-zinc-900/90 border border-zinc-800 rounded-2xl p-1.5 focus-within:border-amber-400/60 focus-within:ring-1 focus-within:ring-amber-400/40 transition-all">
                <input 
                    type="text" 
                    id="miles-chat-input" 
                    placeholder="Digite sua mensagem para o Miles..."
                    autocomplete="off" 
                    maxlength="500" 
                    class="flex-1 bg-transparent px-3 py-2 text-sm sm:text-base text-white placeholder-zinc-500 focus:outline-none font-sans"
                    aria-label="Mensagem para o Miles"
                >
                <button 
                    type="submit" 
                    id="miles-send-btn" 
                    class="w-10 h-10 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 active:scale-95 text-zinc-950 font-bold flex items-center justify-center shadow-lg transition-transform disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
                    aria-label="Enviar"
                >
                    <svg class="w-5 h-5 fill-current transform rotate-45 -translate-x-0.5 translate-y-0.5" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>

        </footer>
    </div>

    <!-- Script principal da página do Miles -->
    <script type="module" src="js/miles-page.js"></script>

</body>

</html>
