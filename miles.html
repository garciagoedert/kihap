<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Miles — Assistente Virtual | Kihap Martial Arts</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kihap: {
                            gold: '#FFC107',
                            amber: '#FF8F00',
                            light: '#FFFDF5',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        title: ['Montserrat', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #FFFDF5 0%, #F5F5F7 50%, #FEF9C3 100%);
            background-attachment: fixed;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
        }

        /* Glassmorphism Cards Light */
        .miles-glass-header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.25);
        }

        .miles-glass-footer {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(251, 191, 36, 0.25);
        }

        .miles-user-bubble {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #111827;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        .miles-bot-bubble {
            background: #ffffff;
            border: 1px solid rgba(229, 231, 235, 0.9);
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* Animations */
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .online-dot-pulse {
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes bounceDot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .typing-dot {
            animation: bounceDot 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Custom Scrollbar */
        #miles-chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        #miles-chat-messages::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.3);
            border-radius: 4px;
        }

        /* Hide scrollbars for chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="h-full overflow-hidden flex flex-col justify-between md:py-4 md:px-6">

    <!-- Container App Shell: Responsivo (Fullscreen em Mobile / Card Expandido no Desktop) -->
    <div class="w-full md:max-w-4xl lg:max-w-5xl mx-auto h-full md:h-[calc(100vh-2rem)] flex flex-col bg-white/80 backdrop-blur-xl md:rounded-3xl md:border md:border-amber-400/30 md:shadow-2xl relative overflow-hidden">

        <!-- HEADER -->
        <header class="miles-glass-header px-4 py-3.5 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center gap-3">
                <a href="index.html" class="p-2 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-amber-100/60 transition-colors flex items-center justify-center" aria-label="Voltar para a home">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                
                <div class="relative">
                    <div class="w-10 h-10 rounded-2xl overflow-hidden ring-2 ring-amber-400/50 bg-amber-50 flex items-center justify-center shadow-sm">
                        <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles Avatar" class="w-full h-full object-cover">
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full online-dot-pulse"></span>
                </div>

                <div>
                    <h1 class="text-sm md:text-base font-extrabold text-gray-900 flex items-center gap-1.5 font-title tracking-wide">
                        Miles
                        <span class="bg-amber-400/20 text-amber-800 border border-amber-400/40 text-[10px] px-2 py-0.5 rounded-full font-sans font-bold">AI</span>
                    </h1>
                    <p class="text-[11px] md:text-xs text-gray-500 font-medium">Assistente Virtual Kihap</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="index.html" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-bold text-gray-700 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl transition-colors">
                    <span>🏠</span> Site Kihap
                </a>
                <button id="miles-reset-btn" class="p-2 rounded-xl text-gray-500 hover:text-gray-900 hover:bg-amber-100/60 transition-colors" title="Reiniciar conversa" aria-label="Reiniciar conversa">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- CHAT MESSAGES AREA -->
        <main id="miles-chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scroll-smooth bg-gradient-to-b from-amber-50/30 to-white/40">
            
            <!-- Miles Welcome Card -->
            <div class="flex flex-col items-center text-center my-4 p-6 rounded-3xl bg-white/90 border border-amber-300/40 shadow-sm max-w-lg mx-auto">
                <div class="w-20 h-20 rounded-3xl overflow-hidden ring-4 ring-amber-400/40 mb-3 bg-amber-50 shadow-md">
                    <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles" class="w-full h-full object-cover">
                </div>
                <h2 class="text-lg font-black text-gray-900 font-title uppercase tracking-tight">Oi, eu sou o Miles! 🥋</h2>
                <p class="text-sm text-gray-600 mt-1.5 leading-relaxed">
                    Estou aqui para tirar dúvidas, mostrar nossos programas, consultar horários e agendar sua <strong>aula experimental gratuita</strong>!
                </p>
            </div>

            <!-- Typing indicator (hidden by default) -->
            <div id="miles-typing-indicator" class="hidden flex items-start gap-2.5 max-w-[85%]">
                <div class="w-8 h-8 rounded-xl overflow-hidden bg-amber-50 shrink-0 border border-amber-300/40 shadow-sm">
                    <img src="imgs/personagens/perfilpersonagens/avatar_05.png" alt="Miles" class="w-full h-full object-cover">
                </div>
                <div class="miles-bot-bubble px-4 py-3 rounded-2xl flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></span>
                    <span class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></span>
                </div>
            </div>

        </main>

        <!-- FOOTER & INPUT AREA -->
        <footer class="miles-glass-footer p-3 sm:p-4 pb-[calc(0.75rem+env(safe-area-inset-bottom))] z-20 shrink-0 space-y-3">
            
            <!-- Quick Chips Bar -->
            <div id="miles-chips-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 px-1">
                <button class="miles-chip text-xs font-bold bg-amber-400/20 text-amber-900 border border-amber-400/60 hover:bg-amber-400/40 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Quero agendar uma aula experimental grátis">
                    <span>🥋</span> Agendar aula grátis
                </button>
                <button class="miles-chip text-xs font-semibold bg-white text-gray-800 border border-gray-200 hover:border-amber-400 hover:bg-amber-50 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Quais turmas e horários estão disponíveis?">
                    <span>📅</span> Ver horários de aulas
                </button>
                <button class="miles-chip text-xs font-semibold bg-white text-gray-800 border border-gray-200 hover:border-amber-400 hover:bg-amber-50 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Onde ficam as unidades da Kihap?">
                    <span>📍</span> Onde ficam as unidades?
                </button>
                <button class="miles-chip text-xs font-semibold bg-white text-gray-800 border border-gray-200 hover:border-amber-400 hover:bg-amber-50 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Me explique sobre os programas para crianças e adultos">
                    <span>💡</span> Conhecer programas
                </button>
                <button class="miles-chip text-xs font-semibold bg-white text-gray-800 border border-gray-200 hover:border-amber-400 hover:bg-amber-50 px-3.5 py-1.5 rounded-full whitespace-nowrap transition-all flex items-center gap-1.5 shrink-0 shadow-sm" data-prompt="Quero falar no WhatsApp de uma unidade">
                    <span>💬</span> Falar no WhatsApp
                </button>
            </div>

            <!-- Input Form -->
            <form id="miles-chat-form" class="flex items-center gap-2 bg-white border border-gray-300/80 rounded-2xl p-1.5 shadow-sm focus-within:border-amber-500 focus-within:ring-2 focus-within:ring-amber-400/30 transition-all">
                <input 
                    type="text" 
                    id="miles-chat-input" 
                    placeholder="Digite sua mensagem para o Miles..."
                    autocomplete="off" 
                    maxlength="500" 
                    class="flex-1 bg-transparent px-3.5 py-2.5 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none font-sans"
                    aria-label="Mensagem para o Miles"
                >
                <!-- Botao de Envio com Icone de Aviao de Papel Corrigido (Alinhado Perfeitamente para a Direita) -->
                <button 
                    type="submit" 
                    id="miles-send-btn" 
                    class="w-11 h-11 rounded-xl bg-amber-400 hover:bg-amber-500 active:scale-95 text-gray-950 font-bold flex items-center justify-center shadow-md transition-transform disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
                    aria-label="Enviar mensagem"
                >
                    <svg class="w-5 h-5 fill-current text-gray-950" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>

        </footer>
    </div>

    <!-- Script principal da página do Miles -->
    <script type="module" src="js/miles-page.js"></script>

</body>

</html>
