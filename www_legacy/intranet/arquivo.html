<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "dark";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
        window.tailwind = { config: { darkMode: "class" } };
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permissões de Rede Universais (CSP) para Web e Mobile -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <link rel="icon" href="https://kihap.com.br/wp-content/uploads/2021/02/logo-wh.png" type="image/png">
    <title>Arquivo de Leads - CRM Intranet</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="log.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <div id="app-container" class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden"></div>

        <!-- Main Content View -->
        <main id="main-content" class="flex-1 flex flex-col h-screen overflow-y-auto custom-scrollbar transition-all duration-300 ease-in-out">
            
            <!-- Intranet Glassmorphism Header Navbar -->
            <header class="h-20 bg-white/80 dark:bg-[#111111]/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800/80 px-8 flex items-center justify-between sticky top-0 z-20">
                <div class="flex items-center gap-4">
                    <button id="mobile-menu-btn" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-2xl bg-gray-50 dark:bg-gray-800 text-gray-500">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight flex items-center gap-2">
                            <i class="fas fa-box-archive text-amber-500"></i> Arquivo de Leads (CRM)
                        </h1>
                        <p class="text-xs text-gray-400 font-medium hidden sm:block">Gerenciamento, consulta e desarquivamento de oportunidades do CRM.</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="refresh-archived-btn" class="px-4 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl text-xs font-bold transition-all border border-gray-200 dark:border-gray-700 flex items-center gap-2">
                        <i class="fas fa-sync-alt text-amber-500"></i>
                        <span>Atualizar</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Padding -->
            <div class="p-8 space-y-8 max-w-7xl mx-auto w-full">
                
                <!-- KPI Metric Cards Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white dark:bg-[#1a1a1a] p-6 rounded-3xl border border-gray-100 dark:border-gray-800/80 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Arquivados</p>
                            <h3 id="kpi-total-archived" class="text-3xl font-black text-gray-900 dark:text-white mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl font-bold border border-amber-500/20">
                            <i class="fas fa-archive"></i>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-[#1a1a1a] p-6 rounded-3xl border border-gray-100 dark:border-gray-800/80 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Valor Estimado</p>
                            <h3 id="kpi-total-value" class="text-3xl font-black text-emerald-500 mt-1">R$ 0,00</h3>
                        </div>
                        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-xl font-bold border border-emerald-500/20">
                            <i class="fas fa-hand-holding-dollar"></i>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-[#1a1a1a] p-6 rounded-3xl border border-gray-100 dark:border-gray-800/80 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Contatos Registrados</p>
                            <h3 id="kpi-total-contacts" class="text-3xl font-black text-blue-500 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl font-bold border border-blue-500/20">
                            <i class="fas fa-comments"></i>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-[#1a1a1a] p-6 rounded-3xl border border-gray-100 dark:border-gray-800/80 shadow-sm flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Setores Únicos</p>
                            <h3 id="kpi-total-sectors" class="text-3xl font-black text-purple-500 mt-1">0</h3>
                        </div>
                        <div class="w-12 h-12 rounded-2xl bg-purple-500/10 text-purple-500 flex items-center justify-center text-xl font-bold border border-purple-500/20">
                            <i class="fas fa-layer-group"></i>
                        </div>
                    </div>
                </div>

                <!-- Glassmorphism Filter & Search Card -->
                <div class="bg-white dark:bg-[#1a1a1a] p-6 rounded-3xl border border-gray-100 dark:border-gray-800/80 shadow-sm space-y-4">
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="relative flex-grow w-full">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-search text-sm"></i>
                            </span>
                            <input type="text" id="search-input" placeholder="Buscar por nome, empresa, setor, telefone ou e-mail..." class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700/80 rounded-2xl text-xs font-semibold text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                        </div>
                        
                        <div class="flex flex-wrap sm:flex-nowrap items-center gap-3 w-full md:w-auto">
                            <select id="sector-filter" class="w-full sm:w-48 px-4 py-3 bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700/80 rounded-2xl text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                                <option value="">Todos os Setores</option>
                            </select>

                            <select id="priority-filter" class="w-full sm:w-44 px-4 py-3 bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700/80 rounded-2xl text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                                <option value="">Todas Prioridades</option>
                                <option value="5">5 - Máxima 🚀</option>
                                <option value="4">4 - Alta 🔥</option>
                                <option value="3">3 - Média ⭐</option>
                                <option value="2">2 - Baixa ❄️</option>
                                <option value="1">1 - Mínima 💤</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Archived Lead Cards Grid -->
                <div id="archived-leads-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic lead cards populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modern Styled Lead Details / Edit Modal -->
    <div id="editClientModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-[#1a1a1a] rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col border border-gray-100 dark:border-gray-800 overflow-hidden animate-fadeIn">
            
            <div class="flex justify-between items-center p-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-amber-500/10 rounded-2xl flex items-center justify-center text-amber-500 font-bold border border-amber-500/20">
                        <i class="fas fa-user-edit"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-black text-gray-900 dark:text-white tracking-tight">Detalhes do Lead Arquivado</h3>
                        <p class="text-xs text-gray-400">Edite dados, consulte o histórico ou desarquive para o CRM.</p>
                    </div>
                </div>
                <button id="cancelEditBtn" class="w-10 h-10 flex items-center justify-center rounded-2xl text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <form id="editClientForm" class="p-6 overflow-y-auto custom-scrollbar space-y-6 flex-1">
                <input type="hidden" id="editClientId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="editClientEmpresa" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Empresa / Lead *</label>
                        <input type="text" id="editClientEmpresa" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label for="editClientSetor" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Setor *</label>
                        <input type="text" id="editClientSetor" placeholder="Ex: Imobiliário" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label for="editClientPrioridade" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Prioridade *</label>
                        <select id="editClientPrioridade" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                            <option value="">Selecione</option>
                            <option value="5">5 - Máxima 🚀</option>
                            <option value="4">4 - Alta 🔥</option>
                            <option value="3">3 - Média ⭐</option>
                            <option value="2">2 - Baixa ❄️</option>
                            <option value="1">1 - Mínima 💤</option>
                        </select>
                    </div>
                    <div>
                        <label for="editClientTicket" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Ticket Estimado (R$)</label>
                        <input type="number" id="editClientTicket" placeholder="15000" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editOrigemLead" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Origem do Lead</label>
                        <input type="text" id="editOrigemLead" placeholder="Ex: Indicação, Google" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editResponsavel" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Nome do Responsável</label>
                        <input type="text" id="editResponsavel" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editClientTelefone" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Telefone</label>
                        <input type="text" id="editClientTelefone" placeholder="(48) 99999-9999" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editClientEmail" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Email</label>
                        <input type="email" id="editClientEmail" placeholder="contato@empresa.com" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editClientCpf" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">CPF</label>
                        <input type="text" id="editClientCpf" placeholder="000.000.000-00" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label for="editClientCnpj" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">CNPJ</label>
                        <input type="text" id="editClientCnpj" placeholder="00.000.000/0000-00" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="editClientEndereco" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Endereço</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="editClientEndereco" placeholder="Rua, Número, Bairro, Cidade" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <button type="button" id="openEditMapBtn" title="Abrir no Google Maps" class="px-4 py-3 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl text-xs flex items-center gap-1.5 shrink-0 transition-all">
                                <i class="fas fa-map-marker-alt"></i> Maps
                            </button>
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label for="editClientRedesSociais" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Redes Sociais</label>
                        <textarea id="editClientRedesSociais" rows="2" placeholder="Links do Instagram, Facebook, etc." class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-medium text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 custom-scrollbar"></textarea>
                    </div>

                    <div class="md:col-span-2">
                        <label for="editClientSiteAtual" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Site Atual</label>
                        <input type="text" id="editClientSiteAtual" placeholder="empresa.com.br" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>

                    <div class="md:col-span-2">
                        <label for="editClientObservacoes" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Follow-up / Observações</label>
                        <textarea id="editClientObservacoes" rows="3" class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-medium text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 custom-scrollbar"></textarea>
                    </div>

                    <div class="md:col-span-2 space-y-2">
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Log de Contatos</label>
                        <div id="contactLogContainer" class="max-h-40 overflow-y-auto custom-scrollbar bg-gray-50 dark:bg-gray-900/60 p-3 rounded-2xl space-y-3 border border-gray-200 dark:border-gray-800">
                            <!-- Log entries injected here -->
                        </div>
                        <div class="flex gap-2 pt-1">
                            <textarea id="newContactLog" rows="2" placeholder="Adicionar novo contato..." class="w-full bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 text-xs font-medium text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 custom-scrollbar"></textarea>
                            <button type="button" id="addContactLogBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-xs self-start transition-all shadow-md">Adicionar</button>
                        </div>
                    </div>

                    <div id="createdByContainer" class="md:col-span-2 text-xs text-gray-400 hidden">
                        <p>Criado por: <span id="createdByInfo" class="font-bold text-gray-200"></span></p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-6 border-t border-gray-200 dark:border-gray-800">
                    <div id="modalActionButtons" class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <button type="button" id="unarchiveBtn" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-emerald-500/20 flex items-center gap-1.5">
                            <i class="fas fa-box-open"></i> Desarquivar para CRM
                        </button>
                        <button type="button" id="deleteBtn" class="px-4 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-red-500/20 flex items-center gap-1.5">
                            <i class="fas fa-trash-alt"></i> Excluir
                        </button>
                    </div>
                    <div id="formControls" class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button type="button" id="editBtn" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs transition-all shadow-md shadow-amber-500/20 flex items-center gap-1.5">
                            <i class="fas fa-pencil-alt"></i> Habilitar Edição
                        </button>
                        <button type="button" id="cancelEditFormBtn" class="px-4 py-2.5 bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold rounded-xl text-xs transition-all hidden">
                            Cancelar
                        </button>
                        <button type="submit" id="saveBtn" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-amber-500 text-black font-black rounded-xl text-xs transition-all shadow-lg shadow-amber-500/20 hidden flex items-center gap-1.5">
                            <i class="fas fa-save"></i> Salvar Alterações
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { loadComponents } from './common-ui.js';
        import './auth.js';
        import './arquivo-main.js';

        document.addEventListener('DOMContentLoaded', () => {
            loadComponents();
        });
    </script>
</body>
</html>
