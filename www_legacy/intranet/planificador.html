<html lang="pt-BR">

<head>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
        window.tailwind = { config: { darkMode: "class" } };

    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Planificador - Intranet Kihap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="log.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .ql-editor {
            min-height: 300px;
            background-color: #374151;
            /* gray-700 */
            color: white;
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .ql-toolbar {
            background-color: #1f2937;
            /* gray-800 */
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            border-color: #4b5563 !important;
            /* gray-600 */
        }

        .ql-container {
            border-color: #4b5563 !important;
            /* gray-600 */
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            font-size: 1rem;
        }

        .ql-stroke {
            stroke: #e5e7eb !important;
            /* gray-200 */
        }

        .ql-fill {
            fill: #e5e7eb !important;
            /* gray-200 */
        }

        .ql-picker {
            color: #e5e7eb !important;
            /* gray-200 */
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <div class="flex h-screen">
        <div id="sidebar-container"></div>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden"></div>
        <main id="main-content"
            class="flex-1 flex flex-col h-screen overflow-hidden transition-all duration-300 ease-in-out">
            <div id="header-container"></div>

            <div class="flex-1 overflow-y-auto">
                <!-- Seção 1: Catálogo de Planos (Visão Principal) -->
                <div id="plans-catalog-section" class="p-4 sm:p-6 md:p-8 max-w-7xl mx-auto w-full">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4 pb-4 border-b border-gray-700">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Planificador de Aulas</h1>
                            <p class="text-xs sm:text-sm text-gray-400 mt-1">Consulte o conteúdo pedagógico, treinos e mídias das aulas da KIHAP.</p>
                        </div>

                        <button id="add-plan-btn"
                            class="bg-primary hover:bg-primary-dark text-black font-extrabold py-2.5 px-5 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg text-sm self-start sm:self-auto">
                            <i class="fas fa-plus"></i> Novo Plano
                        </button>
                    </div>

                    <!-- Lista de Planos -->
                    <div id="plans-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <!-- Cards de planos serão inseridos aqui via JS -->
                        <div class="col-span-full text-center text-gray-500 py-12">
                            <i class="fas fa-spinner fa-spin text-3xl mb-3 text-primary"></i>
                            <p class="text-sm font-medium">Carregando planos de aula...</p>
                        </div>
                    </div>
                </div>

                <!-- Seção 2: Visualização em Página Completa do Plano (Read-Only) -->
                <div id="plan-view-section" class="hidden p-4 sm:p-6 md:p-8 max-w-5xl mx-auto w-full">
                    <!-- Top Bar Navegação -->
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-700 gap-3">
                        <button id="back-to-catalog-btn-view" type="button" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold text-xs transition-all border border-gray-700">
                            <i class="fas fa-arrow-left text-sm"></i> <span>Voltar aos Planos</span>
                        </button>

                        <div class="flex items-center gap-2">
                            <button type="button" id="edit-plan-btn-view"
                                class="px-4 py-2 rounded-xl bg-primary hover:bg-primary-dark text-black font-extrabold transition-all text-xs shadow-md flex items-center gap-1.5">
                                <i class="fas fa-edit"></i> <span>Editar Plano</span>
                            </button>
                        </div>
                    </div>

                    <!-- Conteúdo do Plano -->
                    <div class="bg-gray-800 rounded-3xl p-5 sm:p-8 border border-gray-700 shadow-xl mb-8">
                        <div class="mb-6">
                            <div class="flex items-center gap-3 mb-2 flex-wrap">
                                <span id="view-plan-category" class="bg-blue-600 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg shadow-sm">TIPO A</span>
                                <div class="text-xs text-gray-400 font-medium" id="view-plan-meta">Autor • Data</div>
                            </div>
                            <h1 id="view-plan-title" class="text-2xl sm:text-4xl font-black text-white leading-tight">Título do Plano</h1>
                        </div>

                        <!-- Conteúdo Renderizado -->
                        <div class="prose prose-invert max-w-none mb-8">
                            <p id="view-plan-content" class="whitespace-pre-wrap text-gray-200 text-sm sm:text-base leading-relaxed"></p>
                        </div>

                        <!-- Mídia e Anexos -->
                        <div class="border-t border-gray-700 pt-6">
                            <h3 class="text-lg font-extrabold text-gray-100 mb-4 flex items-center gap-2">
                                <i class="fas fa-paperclip text-primary text-base"></i> Mídia e Anexos
                            </h3>
                            <div id="view-media-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                <!-- Itens de mídia entrarão aqui -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Seção 3: Editor em Página Completa (Criação/Edição) -->
                <div id="plan-edit-section" class="hidden p-4 sm:p-6 md:p-8 max-w-5xl mx-auto w-full">
                    <!-- Top Bar Navegação -->
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-700">
                        <button id="back-to-catalog-btn-edit" type="button" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold text-xs transition-all border border-gray-700">
                            <i class="fas fa-arrow-left text-sm"></i> <span>Cancelar e Voltar</span>
                        </button>
                        <h2 id="modal-title" class="text-lg sm:text-xl font-extrabold text-white">Novo Plano de Aula</h2>
                    </div>

                    <div class="bg-gray-800 rounded-3xl p-5 sm:p-8 border border-gray-700 shadow-xl">
                        <form id="plan-form" class="space-y-6">
                            <input type="hidden" id="plan-id">

                            <!-- Título e Categoria -->
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div class="md:col-span-3">
                                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Título do Plano</label>
                                    <input type="text" id="plan-title" required
                                        class="w-full bg-gray-700 text-white font-semibold rounded-xl px-4 py-3 border border-gray-600 focus:border-blue-500 focus:outline-none transition-all text-sm"
                                        placeholder="Ex: Aula Adulto A - Terça-feira">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-1.5">Tipo</label>
                                    <select id="plan-category" required
                                        class="w-full bg-gray-700 text-white font-semibold rounded-xl px-4 py-3 border border-gray-600 focus:border-blue-500 focus:outline-none transition-all text-sm">
                                        <option value="A">Planificador A</option>
                                        <option value="B">Planificador B</option>
                                        <option value="C">Planificador C</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Conteúdo (Quill Editor) -->
                            <div class="border-t border-gray-700 pt-4">
                                <label class="block text-sm font-bold text-gray-200 mb-2">Conteúdo da Aula</label>
                                <div class="bg-gray-700 rounded-xl overflow-hidden border border-gray-600">
                                    <div id="editor-container" class="h-64 text-white"></div>
                                </div>
                            </div>

                            <!-- Upload de Mídia -->
                            <div class="border-t border-gray-700 pt-4">
                                <label class="block text-sm font-bold text-gray-200 mb-2">Mídia e Anexos (Arquivos e Vídeos)</label>

                                <!-- Youtube Link Input -->
                                <div class="flex flex-col sm:flex-row gap-2 mb-3">
                                    <input type="text" id="youtube-link"
                                        class="flex-1 bg-gray-700 text-white rounded-xl px-4 py-2.5 border border-gray-600 focus:border-blue-500 focus:outline-none text-xs sm:text-sm font-medium"
                                        placeholder="Cole o link do YouTube aqui">
                                    <button type="button" id="add-youtube-btn"
                                        class="bg-red-650 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl transition-all font-bold text-xs flex items-center justify-center gap-2 shadow-sm">
                                        <i class="fab fa-youtube text-base"></i> Adicionar
                                    </button>
                                </div>

                                <div class="flex items-center space-x-3 mb-3">
                                    <label
                                        class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white px-4 py-2.5 rounded-xl transition-all border border-gray-600 text-xs font-bold flex items-center gap-2">
                                        <i class="fas fa-cloud-upload-alt text-blue-400"></i> Adicionar Arquivo
                                        <input type="file" id="media-upload" class="hidden" accept="image/*,video/*" multiple>
                                    </label>
                                    <span id="upload-status" class="text-xs text-gray-400"></span>
                                </div>

                                <!-- Lista de Itens de Mídia -->
                                <div id="media-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                    <!-- Preview de arquivos serão adicionados aqui -->
                                </div>
                            </div>

                            <div class="flex justify-between pt-6 border-t border-gray-700 gap-3">
                                <button type="button" id="delete-plan-btn"
                                    class="px-4 py-2.5 rounded-xl text-red-400 hover:text-red-300 hover:bg-gray-700 transition-all font-bold text-xs hidden">
                                    <i class="fas fa-trash mr-1.5"></i> Excluir Plano
                                </button>
                                <div class="flex space-x-3 ml-auto">
                                    <button type="button" id="cancel-plan-btn"
                                        class="px-5 py-2.5 rounded-xl text-gray-300 hover:bg-gray-700 transition-all font-bold text-xs">
                                        Cancelar
                                    </button>
                                    <button type="submit" id="save-plan-btn"
                                        class="px-7 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-extrabold transition-all text-xs shadow-md">
                                        Salvar Plano
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Elements para compatibilidade com chamadas legado -->
            <div id="plan-modal" class="hidden"></div>
            <div id="view-modal" class="hidden"></div>
            <button id="close-plan-modal" class="hidden"></button>
            <button id="close-view-modal" class="hidden"></button>

    <!-- Template para View de Cards (Script Module) -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
        import { loadComponents } from './common-ui.js';
        import './planificador.js';

        document.addEventListener('DOMContentLoaded', () => {
            loadComponents();
        });
    </script>
</body>

</html>
