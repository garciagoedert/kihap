<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
        window.tailwind = { config: { darkMode: "class" } };
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permissões de Rede Universais (CSP) para Web e Mobile -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <title>Editor de Conteúdo - Intranet KIHAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="log.css">
    <link rel="shortcut icon" href="/imgs/favicon.png" type="image/x-icon">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ql-editor {
            min-height: 280px;
            background-color: transparent;
            color: inherit;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .ql-toolbar {
            background-color: rgba(243, 244, 246, 0.6);
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
            border-color: rgba(229, 231, 235, 0.8) !important;
        }
        .dark .ql-toolbar {
            background-color: rgba(31, 41, 55, 0.6);
            border-color: rgba(55, 65, 81, 0.8) !important;
        }
        .ql-container {
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
            border-color: rgba(229, 231, 235, 0.8) !important;
        }
        .dark .ql-container {
            border-color: rgba(55, 65, 81, 0.8) !important;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <div class="flex h-screen">
        <div id="sidebar-container"></div>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden"></div>
        <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden transition-all duration-300 ease-in-out">
            <div id="header-container" class="flex-shrink-0"></div>
            
            <div class="flex-1 overflow-y-auto">
                <div class="p-4 sm:p-6 md:p-8 max-w-5xl mx-auto w-full">
                    
                    <!-- Navigation & Title -->
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-150 dark:border-gray-800 gap-3">
                        <a href="tatame.html" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white dark:bg-[#1a1a1a] hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200 font-bold text-xs transition-all border border-gray-200 dark:border-gray-800 shadow-sm">
                            <i class="fas fa-arrow-left text-xs"></i> <span>Cancelar e Voltar</span>
                        </a>
                        <h2 id="editor-title" class="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">Novo Conteúdo</h2>
                    </div>

                    <!-- Editor Form Container -->
                    <div class="bg-white dark:bg-[#1a1a1a] rounded-3xl p-5 sm:p-8 border border-gray-150 dark:border-gray-800 shadow-xl space-y-6">
                        
                        <!-- Title Field -->
                        <div>
                            <label for="articleTitle" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Título do Conteúdo *</label>
                            <input type="text" id="articleTitle" placeholder="Ex: E se o seu filho se perder?" required
                                class="w-full bg-gray-50 dark:bg-gray-900/50 text-gray-950 dark:text-white font-semibold rounded-xl px-4 py-3 border border-gray-200 dark:border-gray-800 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all text-sm">
                        </div>

                        <!-- Hero Banner Field -->
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Imagem de Capa (Banner)</label>
                            <div class="mt-1 flex justify-center rounded-2xl border-2 border-dashed border-gray-200 dark:border-gray-800 p-6 bg-gray-50/50 dark:bg-gray-900/30">
                                <div class="text-center">
                                    <img id="heroImagePreview" src="#" alt="Preview do banner" class="mx-auto max-h-40 mb-4 hidden rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm"/>
                                    <i id="heroImageIcon" class="fas fa-image text-3xl text-gray-400 mb-2"></i>
                                    <div class="flex items-center justify-center text-xs text-gray-500 gap-2">
                                        <label for="heroImageInput" class="cursor-pointer rounded-xl bg-white dark:bg-gray-800 font-bold text-amber-500 hover:text-amber-600 px-3 py-1.5 border border-gray-200 dark:border-gray-700 shadow-sm transition-all">
                                            <span>Escolher Arquivo</span>
                                            <input id="heroImageInput" name="heroImage" type="file" class="sr-only" accept="image/*">
                                        </label>
                                        <span>ou selecione uma imagem</span>
                                    </div>
                                    <button type="button" id="removeHeroImage" class="mt-2 text-xs text-red-500 hover:text-red-600 font-bold hidden">Remover Imagem</button>
                                </div>
                            </div>
                        </div>

                        <!-- YouTube Link Field -->
                        <div>
                            <label for="youtubeUrl" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">URL do Vídeo do YouTube (Opcional)</label>
                            <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..."
                                class="w-full bg-gray-50 dark:bg-gray-900/50 text-gray-950 dark:text-white font-semibold rounded-xl px-4 py-3 border border-gray-200 dark:border-gray-800 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all text-sm">
                        </div>

                        <!-- Content Editor Field -->
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Conteúdo Principal</label>
                            <div id="editor" class="bg-gray-50/50 dark:bg-gray-900/30 rounded-2xl"></div>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between pt-4 border-t border-gray-150 dark:border-gray-800 gap-4">
                            <div class="flex items-center gap-3">
                                <button type="button" id="saveArticle" class="bg-primary hover:bg-primary-dark text-black font-extrabold py-3 px-6 rounded-2xl text-xs transition-all shadow-md flex items-center justify-center gap-2">
                                    <i class="fas fa-save"></i> Salvar Conteúdo
                                </button>
                                <button type="button" id="attachFile" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold py-3 px-4 rounded-2xl text-xs transition-all border border-gray-200 dark:border-gray-700 flex items-center gap-1.5">
                                    <i class="fas fa-paperclip"></i> Anexar Arquivo
                                </button>
                            </div>
                            <button type="button" id="deleteArticle" class="bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white font-extrabold py-3 px-5 rounded-2xl text-xs transition-all border border-red-500/20 hidden flex items-center justify-center gap-1.5">
                                <i class="fas fa-trash-alt"></i> Excluir Conteúdo
                            </button>
                            <input type="file" id="fileInput" class="hidden">
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
        import { app } from './firebase-config.js';
        import { onAuthReady } from './auth.js';
        import { loadComponents } from './common-ui.js';
        import { initEditorPage } from './tatame.js';

        onAuthReady(user => {
            if (user) {
                loadComponents(() => {
                    initEditorPage();
                });
            }
        });
    </script>
</body>
</html>
