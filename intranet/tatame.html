<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
        window.tailwind = { config: { darkMode: "class" } };
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permissões de Rede Universais (CSP) para Web e Mobile -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <title>Tatame - Intranet KIHAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="log.css">
    <link rel="shortcut icon" href="/imgs/favicon.png" type="image/x-icon">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <div class="flex h-screen">
        <div id="sidebar-container"></div>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden"></div>
        <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden transition-all duration-300 ease-in-out">
            <div id="header-container" class="flex-shrink-0"></div>
            
            <div class="flex-1 overflow-y-auto">
                <div class="p-4 sm:p-6 md:p-8 max-w-7xl mx-auto w-full">
                    
                    <!-- Page Header Bar -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4 pb-4 border-b border-gray-150 dark:border-gray-800">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight flex items-center gap-2.5">
                                <i class="fas fa-layer-group text-amber-500"></i> Conteúdos do Tatame
                            </h1>
                            <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">Biblioteca de conteúdos, metodologias e materiais pedagógicos da KIHAP.</p>
                        </div>

                        <a href="conteudo-editor.html"
                            class="bg-primary hover:bg-primary-dark text-black font-extrabold py-2.5 px-5 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg text-sm self-start sm:self-auto">
                            <i class="fas fa-plus"></i> Novo Conteúdo
                        </a>
                    </div>

                    <!-- Search Input Bar -->
                    <div class="relative flex-1 mb-8 bg-white dark:bg-[#1a1a1a] p-3 sm:p-4 rounded-2xl border border-gray-150 dark:border-gray-800 shadow-sm">
                        <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Buscar conteúdos por título ou palavras-chave..."
                            class="w-full bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-white border border-gray-200 dark:border-gray-700/80 rounded-xl py-2.5 pl-11 pr-4 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                    </div>

                    <!-- Articles Grid List -->
                    <div id="articles-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="col-span-full text-center text-gray-500 py-12">
                            <i class="fas fa-spinner fa-spin text-3xl mb-3 text-primary"></i>
                            <p class="text-sm font-medium">Carregando conteúdos do tatame...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { app } from './firebase-config.js';
        import { onAuthReady } from './auth.js';
        import { loadComponents } from './common-ui.js';
        import { initTatamePage } from './tatame.js';

        onAuthReady(user => {
            if (user) {
                loadComponents(() => {
                    initTatamePage();
                });
            }
        });
    </script>
</body>
</html>
