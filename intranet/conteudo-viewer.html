<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
        window.tailwind = { config: { darkMode: "class" } };
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Permissões de Rede Universais (CSP) para Web e Mobile -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost http://localhost ws: wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:; frame-src 'self' https:; connect-src 'self' capacitor://localhost http://localhost ws: wss: https:;">
    
    <title>Visualizador de Conteúdo - Intranet KIHAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="log.css">
    <link rel="shortcut icon" href="/imgs/favicon.png" type="image/x-icon">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ql-container.ql-snow {
            border: none;
        }
        .ql-editor {
            font-size: 1rem;
            line-height: 1.7;
            padding: 0;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 1.5rem;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#111111] text-gray-900 dark:text-gray-200 transition-colors duration-300">
    <div class="flex h-screen">
        <div id="sidebar-container"></div>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden"></div>
        <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden transition-all duration-300 ease-in-out">
            <div id="header-container" class="flex-shrink-0"></div>
            
            <div class="flex-1 overflow-y-auto">
                <div class="p-4 sm:p-6 md:p-8 max-w-5xl mx-auto w-full">
                    
                    <!-- Top Bar Navigation -->
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-150 dark:border-gray-800 gap-3">
                        <a href="tatame.html" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white dark:bg-[#1a1a1a] hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200 font-bold text-xs transition-all border border-gray-200 dark:border-gray-800 shadow-sm">
                            <i class="fas fa-arrow-left text-xs"></i> <span>Voltar ao Tatame</span>
                        </a>

                        <a id="edit-button" href="#" class="px-4 py-2 rounded-xl bg-primary hover:bg-primary-dark text-black font-extrabold transition-all text-xs shadow-md flex items-center gap-1.5 hidden">
                            <i class="fas fa-edit"></i> <span>Editar Conteúdo</span>
                        </a>
                    </div>

                    <!-- Article Hero / Header Card -->
                    <div class="bg-white dark:bg-[#1a1a1a] rounded-3xl p-6 sm:p-8 border border-gray-150 dark:border-gray-800 shadow-sm mb-8">
                        <div class="mb-6">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20 text-[10px] font-extrabold px-2.5 py-0.5 rounded-lg uppercase">
                                    <i class="fas fa-book-open mr-1"></i> Conteúdo Tatame
                                </span>
                                <span id="article-meta" class="text-xs text-gray-400 font-medium"></span>
                            </div>
                            <h1 id="article-title" class="text-2xl sm:text-4xl font-extrabold text-gray-900 dark:text-white leading-tight">Carregando conteúdo...</h1>
                        </div>

                        <!-- Hero Image Banner -->
                        <div id="hero-container" class="w-full rounded-2xl overflow-hidden mb-6 hidden border border-gray-100 dark:border-gray-800">
                            <img id="hero-image" alt="Banner do Conteúdo" class="w-full max-h-96 object-cover">
                        </div>

                        <!-- YouTube Video Container -->
                        <div id="video-container" class="video-container mb-6 hidden shadow-md">
                            <!-- O Iframe do YouTube será inserido aqui -->
                        </div>

                        <!-- Article Content Box -->
                        <div id="article-content" class="text-gray-800 dark:text-gray-200 leading-relaxed pt-4 border-t border-gray-100 dark:border-gray-800/80">
                            <!-- Conteúdo do artigo será renderizado aqui -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module">
        import { app } from './firebase-config.js';
        import { onAuthReady } from './auth.js';
        import { loadComponents } from './common-ui.js';
        import { initViewerPage } from './tatame.js';

        onAuthReady(user => {
            if (user) {
                loadComponents(() => {
                    initViewerPage();
                });
            }
        });
    </script>
</body>
</html>
